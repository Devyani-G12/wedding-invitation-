<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shruti & Krishna · Wedding Invitation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Tiro+Devanagari+Marathi&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="dust"></canvas>

<section id="splash" class="screen">
  <h1>॥ श्री गणेशाय नमः ॥</h1>
  <p class="names">Shruti &amp; Krishna</p>
  <p class="sub">25 November 2026 · Chhatrapati Sambhajinagar</p>
  <div class="btns">
    <button class="go" data-lang="en">Open invitation</button>
    <button class="go" data-lang="mr" style="font-family:'Tiro Devanagari Marathi',serif">पत्रिका उघडा</button>
  </div>
</section>

<section id="loader" class="screen"><div class="inner"><div class="ring"></div><div class="t">॥ शुभ विवाह ॥</div></div></section>

<section id="stage" class="screen" style="padding:0">
  <div class="book" id="book">
    <button class="cover" id="cover" aria-label="Open the invitation"><img id="coverImg" alt="Wedding invitation cover"></button>
    <button class="card" id="card" type="button" aria-label="Close the invitation card"><img id="cardImg" alt="Wedding invitation card"></button>
  </div>
  <div class="hint" id="hint"></div>
</section>

<div id="flash"></div>
<div class="bar" id="bar">
  <button class="pill" data-sw="en" aria-pressed="false">English</button>
  <button class="pill" data-sw="mr" aria-pressed="false" style="font-family:'Tiro Devanagari Marathi',serif">मराठी</button>
  <button class="pill" id="mute" type="button" aria-label="Mute music" aria-pressed="false">♪</button>
</div>

<script src="script.js" defer></script>
</body></html>
